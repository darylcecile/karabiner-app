appId: com.darylcecile.karabiner
productName: Karabiner
copyright: "Copyright © 2026 Daryl Cecile"
afterPack: build/afterPack.cjs
directories:
  buildResources: build
  output: release
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron/**/*.{ts,tsx,css,scss}'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml,pnpm-workspace.yaml,bun.lock,bun.lockb}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,components.json}'
  - '!**/*.map'
  - '!build/afterPack.cjs'
  # Drop foreign-platform native binaries (we only build for mac targets).
  - '!**/node_modules/@github/copilot-{linux,win32}-*/**'
  - '!**/node_modules/@img/sharp-{linux,linuxmusl,win32}-*/**'
  - '!**/node_modules/@img/sharp-libvips-{linux,linuxmusl,win32}-*/**'
  - '!**/node_modules/@swc/core-{linux,win32,android,freebsd}-*/**'
  - '!**/node_modules/lightningcss-{linux,win32,freebsd,android}-*/**'
  - '!**/node_modules/@tailwindcss/oxide-{linux,win32,freebsd,android}-*/**'
  - '!**/node_modules/onnxruntime-node/bin/napi-v3/{linux,win32}/**'
asarUnpack:
  - resources/**
  - node_modules/@electric-sql/pglite/**
  - node_modules/@xenova/transformers/**
  - node_modules/chokidar/**
  - node_modules/sharp/**
  - node_modules/@img/**
  - node_modules/onnxruntime-node/**
  - node_modules/@meridius-labs/apple-on-device-ai/**
  - node_modules/just-bash/**
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  artifactName: ${name}-${version}-${arch}.${ext}
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
win:
  target:
    - target: nsis
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  artifactName: ${name}-${version}-${arch}.${ext}
nsis:
  artifactName: ${name}-${version}-${arch}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
  category: Utility
  maintainer: darylcecile
  artifactName: ${name}-${version}-${arch}.${ext}
appImage:
  artifactName: ${name}-${version}-${arch}.${ext}
npmRebuild: false
